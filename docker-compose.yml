services:
  postgres:
    image: postgres:16
    container_name: sanctions_screening_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sift}
      POSTGRES_DB: ${POSTGRES_DB:-sanctions_screening}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sift}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
