[project]
name = "sanctions-screening-pipeline"
version = "0.1.0"
description = "Screens Companies House officers and companies against sanctions lists, with explainable scores and a measured alert threshold"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "dbt-postgres>=1.11.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["explore/*.ipynb"]
